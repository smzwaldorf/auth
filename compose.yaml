services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smz_identity
      POSTGRES_USER: smz
      POSTGRES_PASSWORD: smz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - smz_auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smz -d smz_identity"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  smz_auth_postgres:
