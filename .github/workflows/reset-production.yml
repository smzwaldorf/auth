name: Reset production Auth (one-time)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type exactly "WIPE production-auth"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-auth
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirmation == 'WIPE production-auth'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT_ENVIRONMENT: production
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.PRODUCTION_BETTER_AUTH_SECRET }}
      APP_B_CLIENT_SECRET: ${{ secrets.PRODUCTION_UNUSED_APP_B_SECRET }}
      CMS_OIDC_CLIENT_SECRET: ${{ secrets.PRODUCTION_CMS_OIDC_CLIENT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      AUTH_ISSUER: https://auth.smzwaldorf.com/api/auth
      CMS_ORIGIN: https://news.smzwaldorf.com
      APP_A_ORIGIN: https://app-a.smzwaldorf.com
      APP_B_ORIGIN: https://app-b.smzwaldorf.com
      PRODUCTION_DATABASE_RESET_APPROVED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Verify the dedicated production connector
        run: node scripts/provision-production-hyperdrive.mjs auth
      - name: Clear and seed only the confirmed production Auth database
        run: node scripts/reset-production-through-hyperdrive.mjs
      - run: node scripts/smoke-deployment.mjs
