name: Diagnose production Auth landing page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture the exception for one production landing-page request
        run: |
          npx wrangler tail production-smz-auth --format json > worker-tail.ndjson 2>&1 &
          tail_pid=$!
          sleep 5
          curl --silent --show-error --output /dev/null --write-out 'landing HTTP %{http_code}\n' https://auth.smzwaldorf.com/
          sleep 5
          kill "$tail_pid" || true
          wait "$tail_pid" || true
          sed -E 's/(pscale_pw_|sk_)[A-Za-z0-9_-]+/[REDACTED]/g' worker-tail.ndjson
