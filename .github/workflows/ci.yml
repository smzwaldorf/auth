name: Validate and deploy Cloudflare
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: smz
          POSTGRES_PASSWORD: smz
          POSTGRES_DB: smz_magic_test_1
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://smz:smz@localhost:5432/smz_magic_test_1
      AUTH_ISSUER: http://localhost:3000/api/auth
      ENABLE_DEV_LOGIN: "false"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/cloudflare-config.test.mjs
      - run: npm run test:seed
      - run: npm test
      - run: npm run build
      - run: npm run cloudflare:check
      - run: npm run db:migrate
      - run: npm run test:integration -w @smz/auth-server
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      MAGIC_LINK_ENABLED: ${{ vars.MAGIC_LINK_ENABLED }}
      MAGIC_LINK_FROM: Aida <info@useaida.app>
      STAGING_ADMIN_EMAIL: ${{ vars.STAGING_ADMIN_EMAIL }}
      STAGING_PARENT_EMAIL: ${{ vars.STAGING_PARENT_EMAIL }}
      STAGING_PARENT_EMAILS: ${{ vars.STAGING_PARENT_EMAILS }}
      DEPLOY_DEMO_APPS: ${{ vars.DEPLOY_DEMO_APPS }}
      DEPLOY_PAGES: ${{ vars.DEPLOY_PAGES }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
      AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      APP_A_ORIGIN: ${{ vars.APP_A_ORIGIN }}
      APP_B_ORIGIN: ${{ vars.APP_B_ORIGIN }}
      CMS_ORIGIN: ${{ vars.CMS_ORIGIN }}
      CMS_OIDC_CLIENT_SECRET: ${{ secrets.CMS_OIDC_CLIENT_SECRET }}
      PAGES_PROJECT_NAME: ${{ vars.PAGES_PROJECT_NAME }}
      VITE_AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
      VITE_APP_B_ORIGIN: ${{ vars.APP_B_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cloudflare:configure
      - run: node scripts/check-hyperdrive.mjs
      - name: Prepare Worker secrets
        run: node scripts/cloudflare-secrets.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_B_CLIENT_SECRET: ${{ secrets.APP_B_CLIENT_SECRET }}
          APP_B_COOKIE_SECRET: ${{ secrets.APP_B_COOKIE_SECRET }}
      - name: Apply additive database migrations via direct PlanetScale connection
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          NODE_ENV: production
      - name: Add the two confirmed staging identities once
        if: vars.MAGIC_LINK_ENABLED == 'true'
        run: npx tsx packages/auth-server/src/seed/apply-staging-identities.ts
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_B_CLIENT_SECRET: ${{ secrets.APP_B_CLIENT_SECRET }}
      - name: Inspect confirmed staging login mappings (read only)
        if: vars.MAGIC_LINK_ENABLED == 'true'
        run: npx tsx packages/auth-server/src/seed/check-staging-logins.ts
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_B_CLIENT_SECRET: ${{ secrets.APP_B_CLIENT_SECRET }}
      - name: Register deployed OIDC clients
        if: vars.DEPLOY_DEMO_APPS == 'true' || vars.CMS_ORIGIN != ''
        run: npx tsx packages/auth-server/src/seed/deploy-apps.ts
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_B_CLIENT_SECRET: ${{ secrets.APP_B_CLIENT_SECRET }}
      - name: Grant and verify approved CMS access once
        if: vars.MAGIC_LINK_ENABLED == 'true'
        run: npx tsx packages/auth-server/src/seed/apply-staging-cms-access.ts
        env:
          DATABASE_URL: ${{ secrets.PLANETSCALE_DATABASE_URL }}
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APP_B_CLIENT_SECRET: ${{ secrets.APP_B_CLIENT_SECRET }}
      - run: npm run build:app-a
        if: vars.DEPLOY_DEMO_APPS == 'true' && vars.DEPLOY_PAGES != 'false'
      - name: Restrict App A logout framing to Auth
        if: vars.DEPLOY_DEMO_APPS == 'true' && vars.DEPLOY_PAGES != 'false'
        run: node scripts/pages-logout-headers.mjs
      - name: Deploy auth Worker
        run: npx wrangler deploy --config .wrangler/deploy/auth.json --secrets-file .wrangler/deploy/auth-secrets.json
      - name: Deploy App B Worker
        if: vars.DEPLOY_DEMO_APPS == 'true'
        run: npx wrangler deploy --config .wrangler/deploy/app-b.json --secrets-file .wrangler/deploy/app-b-secrets.json
      - name: Ensure Pages project exists
        if: vars.DEPLOY_DEMO_APPS == 'true' && vars.DEPLOY_PAGES != 'false'
        run: node scripts/ensure-pages.mjs
      - name: Deploy Pages frontend from this commit
        if: vars.DEPLOY_DEMO_APPS == 'true' && vars.DEPLOY_PAGES != 'false'
        run: npx wrangler pages deploy apps/vite-app/dist --project-name "$PAGES_PROJECT_NAME" --branch main --commit-hash "$GITHUB_SHA"
      - run: node scripts/smoke-deployment.mjs
      - name: Remove temporary secret files
        if: always()
        run: rm -f .wrangler/deploy/auth-secrets.json .wrangler/deploy/app-b-secrets.json
